<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Fondo con sombra -->
  <rect x="2" y="4" width="60" height="60" rx="14" fill="#E5E7E9"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#F8F9F9" stroke="#E5E7E9" stroke-width="1"/>
  
  <!-- Pincel rotado a 45 grados -->
  <g transform="rotate(45, 32, 32)">
    
    <!-- Mango de madera -->
    <path d="M 26,28 L 26,12 A 6,6 0 0,1 38,12 L 38,28 Z" fill="#9C5C35" stroke="#2C3E50" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Vetas de la madera -->
    <path d="M 29,15 Q 31,21 29,26 M 35,17 Q 33,23 35,27" stroke="#7A4524" stroke-width="1" fill="none" stroke-linecap="round"/>
    
    <!-- Ojal en la parte superior -->
    <circle cx="32" cy="11.5" r="2.5" fill="#F8F9F9" stroke="#2C3E50" stroke-width="1.5"/>
    
    <!-- Virola de metal -->
    <rect x="25" y="28" width="14" height="9" rx="1" fill="#D0D3D4" stroke="#2C3E50" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Relieves de la virola -->
    <line x1="25" y1="31" x2="39" y2="31" stroke="#2C3E50" stroke-width="1.5"/>
    <line x1="25" y1="34" x2="39" y2="34" stroke="#2C3E50" stroke-width="1.5"/>
    
    <!-- Máscara de recorte para que la pintura no salga de las cerdas -->
    <defs>
      <clipPath id="cerdas-clip">
        <path d="M 25,37 C 18,46 22,55 32,60 C 42,55 46,46 39,37 Z"/>
      </clipPath>
    </defs>

    <!-- Grupo con la textura y los colores -->
    <g clip-path="url(#cerdas-clip)">
      <!-- Color base de cerdas -->
      <rect x="15" y="35" width="35" height="30" fill="#C28F5F"/>
      
      <!-- Líneas de las cerdas -->
      <path d="M 27,37 L 24,50 M 32,37 L 32,50 M 37,37 L 40,50" stroke="#A07248" stroke-width="1.5"/>
      
      <!-- Pintura Azul -->
      <path d="M 15,48 Q 23,43 27,51 Q 28,57 22,62 L 15,62 Z" fill="#3498DB"/>
      <!-- Pintura Amarilla -->
      <path d="M 23,50 Q 32,41 36,52 Q 37,59 32,63 L 23,63 Z" fill="#F1C40F"/>
      <!-- Pintura Roja -->
      <path d="M 33,49 Q 40,43 45,52 L 45,62 L 30,62 Z" fill="#E74C3C"/>
    </g>

    <!-- Contorno final de las cerdas dibujado por encima -->
    <path d="M 25,37 C 18,46 22,55 32,60 C 42,55 46,46 39,37 Z" fill="none" stroke="#2C3E50" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
